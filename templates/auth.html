<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Alixer - Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #030417;
            --bg-2: #081028;
            --accent-1: #7b61ff;
            --accent-2: #3dd5ff;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.04);
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            height: 100%;
        }
        
        body {
            font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            background: radial-gradient(1200px 600px at 10% 10%, rgba(61,213,255,0.1), transparent),
                       linear-gradient(180deg, var(--bg-1), var(--bg-2));
            color: var(--white);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* starfield & nebula */
        .scene{position:absolute;inset:0;pointer-events:none;}
        .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0.9;filter:blur(.3px)}
        .twinkle{animation:tw 4s linear infinite}
        @keyframes tw{0%,100%{opacity:.05}50%{opacity:1}}

        /* shooting star */
        .shoot{position:absolute;right:-20%;top:10%;width:2px;height:2px;background:linear-gradient(90deg,#fff,rgba(255,255,255,0));box-shadow:0 0 6px #fff;transform:translateX(0);opacity:0}

        .auth-card {
            position: relative;
            width: 100%;
            max-width: 400px;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: 0 10px 40px rgba(2,6,23,0.7), inset 0 1px 0 rgba(255,255,255,0.05);
            backdrop-filter: blur(8px) saturate(120%);
            border: 1px solid rgba(255,255,255,0.05);
            z-index: 2;
            text-align: center;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 18px;
            border-radius: 18px;
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            position: relative;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius);
            color: var(--white);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-1);
            background: rgba(255,255,255,0.08);
        }

        input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .btn {
            background: linear-gradient(45deg, var(--accent-1), var(--accent-2));
            color: var(--white);
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--accent-1), var(--accent-2));
            color: var(--white);
            border: none;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--white);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(123,97,255,0.3);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .divider {
            margin: 16px 0;
            text-align: center;
            color: rgba(255,255,255,0.55);
            position: relative;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: rgba(255,255,255,0.06);
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .google-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--white);
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .google-btn svg { flex: 0 0 auto }

        .google-btn:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }

        #error {
            color: #ff4444;
            margin-top: 10px;
            font-size: 14px;
            min-height: 20px;
        }

        .success {
            color: #44ff44 !important;
        }

        .top{
            display:flex;
            gap:24px;
            align-items:center;
        }

        .inline-logo{
            width:84px;height:84px;border-radius:14px;display:flex;align-items:center;justify-content:center;
            box-shadow:0 8px 30px rgba(255, 254, 255, 0);
            flex:0 0 84px;
        }

        .brand{font-weight:700;font-size:20px;color:white}
        .tag{font-size:13px;color:rgba(255,255,255,0.75);margin-top:6px}

        h1{margin:18px 0 6px;font-size:34px;line-height:1.02;color:#fff}
        p.lead{margin:0;color:rgba(255,255,255,0.78);font-size:16px}


        .visual{position:absolute;right:30px;top:-30px;opacity:0.14;filter:blur(0.3px);transform:rotate(8deg)}

        .countdown{display:flex;gap:14px;margin-top:28px;align-items:center}
        .unit{background:var(--glass);padding:16px;border-radius:12px;min-width:88px;text-align:center}
        .unit .num{font-weight:800;font-size:22px;color:linear-gradient(90deg,var(--accent-1),var(--accent-2));}
        .unit .label{font-size:12px;color:rgba(255,255,255,0.65);margin-top:6px}

        .subscribe{display:flex;gap:12px;margin-top:26px;align-items:center}
        .email{flex:1;min-width:0}
        input[type=email]{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.04);background:rgba(255,255,255,0.02);color:var(--muted);font-size:14px}
        button.cta{background:linear-gradient(90deg,var(--accent-1),var(--accent-2));border:none;color:#001;background-blend-mode:screen;padding:13px 18px;border-radius:12px;font-weight:700;cursor:pointer}

        .meta{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:16px}
        .socials{display:flex;gap:10px}
        .sbtn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.03);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);text-decoration:none}

        footer.small{font-size:13px;color:rgba(255,255,255,0.55);margin-top:18px}

        @media (max-width:880px){
            .visual{display:none}
            .top{flex-direction:row}
            h1{font-size:26px}
            .card{padding:22px}
            .countdown{flex-wrap:wrap}
        }

        @media (max-width:520px){
            body{padding:20px}
            .top{flex-direction:column;align-items:flex-start}
            .brand{font-size:18px}
        }
    </style>
</head>
<body>
    <div id="stars"></div>

    <main class="auth-card" role="main">
        <div class="logo">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
        </div>

        <h1 class="auth-title">Welcome to Alixer</h1>
        <p class="lead">Sign in to continue, or create a new account. You can also use Google to sign in quickly.</p>

        <div id="error"></div>

        <div class="auth-form">
            <div class="input-group">
                <input type="email" id="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
                    <div class="btn-group">
                        <button type="button" class="btn btn-secondary" onclick="signup()">Sign Up</button>
                        <button type="button" class="btn btn-primary" onclick="login()">Login</button>
                    </div>
                    <div class="divider">or</div>
                    <button type="button" class="google-btn btn-secondary" onclick="signInWithGoogle()" aria-label="Sign in with Google">
                        <!-- inline Google SVG to avoid external fetches -->
                        <svg width="18" height="18" viewBox="0 0 533.5 544.3" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                            <path fill="#4285F4" d="M533.5 278.4c0-18.5-1.5-36.3-4.3-53.6H272v101.5h147.3c-6.3 34.1-25.1 62.9-53.6 82.1v68.1h86.4c50.6-46.6 80.4-115.3 80.4-198.1z"/>
                            <path fill="#34A853" d="M272 544.3c72.6 0 133.6-24.1 178.1-65.5l-86.4-68.1c-24.1 16.2-55 25.9-91.7 25.9-70.5 0-130.3-47.6-151.6-111.2H31.8v69.8C75.8 488.2 168.9 544.3 272 544.3z"/>
                            <path fill="#FBBC05" d="M120.4 327.4c-10.8-32.1-10.8-66.7 0-98.8V158.8H31.8c-41.4 82.9-41.4 178.9 0 261.8l88.6-69.2z"/>
                            <path fill="#EA4335" d="M272 107.7c38.6-.6 75.6 13.8 103.6 39.8l77.7-77.7C405.6 24.6 348.6 0 272 0 168.9 0 75.8 56.1 31.8 158.8l88.6 69.8C141.7 155.3 201.5 107.7 272 107.7z"/>
                        </svg>
                        <span>Sign in with Google</span>
                    </button>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD35otB5ya1MYiBbGsS0bMcicJghgTtJAY",
            authDomain: "alixer-352b3.firebaseapp.com",
            projectId: "alixer-352b3",
            storageBucket: "alixer-352b3.firebasestorage.app",
            messagingSenderId: "440270282191",
            appId: "1:440270282191:web:b291f21901991d286046ba",
            measurementId: "G-2WJC86LPJ4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.signup = async function() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorDiv = document.getElementById("error");
            
            try {
                const user = await createUserWithEmailAndPassword(auth, email, password);
                errorDiv.textContent = "Signup successful!";
                errorDiv.className = "success";
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.className = "";
            }
        }

        window.login = async function() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorDiv = document.getElementById("error");
            
            try {
                const userCred = await signInWithEmailAndPassword(auth, email, password);
                const idToken = await userCred.user.getIdToken(/* forceRefresh */ true);
                
                const res = await fetch("/sessionLogin", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ idToken }),
                });

                if (res.ok) {
                    window.location.href = "/";
                } else {
                    const err = await res.json();
                    if (err.error && err.error.includes('clock')) {
                        errorDiv.textContent = "Please check your computer's clock settings and try again";
                    } else {
                        errorDiv.textContent = err.error || "Login failed";
                    }
                }
            } catch (error) {
                if (error.code === 'auth/id-token-expired' || error.code === 'auth/id-token-revoked') {
                    errorDiv.textContent = "Please check your computer's clock settings are correct and try again";
                } else {
                    errorDiv.textContent = error.message;
                }
                errorDiv.className = "";
            }
        }

        // --- Google sign-in: try popup, fallback to redirect ---
        const provider = new GoogleAuthProvider();

        // If returning from a redirect sign-in flow, process the result and send token to backend
        getRedirectResult(auth).then(async (result) => {
            if (result && result.user) {
                const errorDiv = document.getElementById('error');
                try {
                    const idToken = await result.user.getIdToken();
                    const res = await fetch('/sessionLogin', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ idToken }),
                    });
                    if (res.ok) {
                        window.location.href = '/';
                    } else {
                        const err = await res.json();
                        errorDiv.textContent = err.error || 'Server login failed';
                    }
                } catch (err) {
                    console.error('Error handling redirect result:', err);
                }
            }
        }).catch((err) => {
            // no redirect result or an error occurred — silently ignore or log
            console.debug('getRedirectResult:', err && err.message ? err.message : err);
        });

        window.signInWithGoogle = async function() {
            const errorDiv = document.getElementById('error');
            try {
                const result = await signInWithPopup(auth, provider);
                const idToken = await result.user.getIdToken();
                const res = await fetch('/sessionLogin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken }),
                });
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const err = await res.json();
                    errorDiv.textContent = err.error || 'Server login failed';
                }
            } catch (err) {
                // Popup can be blocked in some environments — fallback to redirect flow
                console.warn('Popup sign-in failed, falling back to redirect:', err && err.code ? err.code : err);
                try {
                    await signInWithRedirect(auth, provider);
                } catch (redirectErr) {
                    errorDiv.textContent = redirectErr && redirectErr.message ? redirectErr.message : 'Unable to sign in with Google.';
                }
            }
        }
    </script>
</body>
</html>
