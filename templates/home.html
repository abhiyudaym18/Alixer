<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Alixer</title> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #030417;
            --bg-2: #081028;
            --accent-1: #7b61ff;
            --accent-2: #3dd5ff;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.04);
            --radius: 18px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            background: radial-gradient(1200px 600px at 10% 10%, rgba(61,213,255,0.06), transparent),
                        linear-gradient(180deg, var(--bg-1), var(--bg-2));
            color: var(--white);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Stars container (kept) */
        #stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 3s infinite; opacity: .8; filter: blur(.3px); }
        @keyframes twinkle { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* Centered prompt area */
        .prompt-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            padding: 24px;
            pointer-events: auto;
        }

        .prompt-box {
            width: min(920px, 94%);
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 8px 40px rgba(2,6,23,0.6), 0 0 60px rgba(61,213,255,0.03);
            position: relative;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.04);
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: stretch;
        }

        /* Glowing aura */
        .prompt-box::before {
            content: "";
            position: absolute;
            inset: -18px;
            border-radius: 24px;
            z-index: -1;
            background: radial-gradient(600px 120px at 10% 10%, rgba(123,97,255,0.14), transparent 20%),
                        radial-gradient(400px 100px at 90% 80%, rgba(61,213,255,0.08), transparent 20%);
            filter: blur(18px);
            opacity: 0.95;
        }

        .prompt-header {
            display:flex;
            align-items:center;
            gap:14px;
        }

        .logo-mini {
            width:64px;
            height:64px;
            border-radius:12px;
            overflow:hidden;
            flex: 0 0 64px;
            box-shadow: 0 8px 30px rgba(123,97,255,0.08);
            border: 1px solid rgba(255,255,255,0.03);
        }

        .logo-mini img { width:100%; height:100%; object-fit:cover; display:block; }

        .prompt-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--white);
        }
        .prompt-sub {
            font-size: 13px;
            color: rgba(255,255,255,0.75);
            margin-top:2px;
        }

        textarea.prompt-input {
            width: 100%;
            min-height: 140px;
            max-height: 320px;
            resize: vertical;
            padding: 16px;
            border-radius: 12px;
            background: rgba(0,0,0,0.35);
            color: var(--white);
            border: 1px solid rgba(255,255,255,0.04);
            font-size: 15px;
            outline: none;
            box-shadow: inset 0 -2px 10px rgba(0,0,0,0.5);
        }
        textarea.prompt-input:focus {
            border: 1px solid rgba(123,97,255,0.8);
            box-shadow: 0 6px 30px rgba(123,97,255,0.12), inset 0 -2px 10px rgba(0,0,0,0.6);
        }

        .prompt-actions {
            display:flex;
            gap:12px;
            align-items:center;
            justify-content: flex-end;
            margin-top: 6px;
        }

        /* Sidebar navigation */
        .sidebar {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 180px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: 0 8px 30px rgba(2,6,23,0.6);
            backdrop-filter: blur(8px);
            z-index: 3;
        }

        .sidebar a {
            color: var(--white);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 10px;
            display: inline-flex;
            gap: 10px;
            align-items: center;
            font-weight: 600;
            background: transparent;
            transition: background 0.18s ease, transform 0.12s ease;
            border: 1px solid transparent;
        }

        .sidebar a:hover {
            background: rgba(255,255,255,0.04);
            transform: translateX(4px);
            border-color: rgba(255,255,255,0.03);
        }

        @media (max-width: 720px) {
            .sidebar { display: none; }
        }

        .btn {
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            color: #001;
            box-shadow: 0 8px 24px rgba(123,97,255,0.18);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.03);
            color: var(--white);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .google-inline {
            display:inline-flex;
            gap:8px;
            align-items:center;
            padding:8px 12px;
            border-radius:10px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.03);
            color:var(--white);
            font-weight:600;
        }

        @media (max-width: 720px) {
            .prompt-box { padding: 18px; border-radius: 14px; }
            .logo-mini { width:52px; height:52px; flex:0 0 52px; }
            textarea.prompt-input { min-height: 120px; }
        }
    </style>
</head>
<body>
    <div id="stars"></div>

    <!-- side navigation -->
    <nav class="sidebar" aria-label="Main navigation">
        <a href="#history">📜 History</a>
        <a href="#thread">💬 Thread</a>
        <a href="#account">👤 Account</a>
        <a href="#settings">⚙️ Settings</a>
    </nav>

    <!-- centered prompt box -->
    <div class="prompt-wrap" aria-hidden="false">
        <div class="prompt-box" role="region" aria-label="Prompt input for Alixer">
            <div class="prompt-header">
                <div class="logo-mini">
                    <img src="/static/logo.png" alt="Alixer logo">
                </div>
                <div>
                    <div class="prompt-title">Alixer — AI Landing Page Generator</div>
                    <div class="prompt-sub">Type your prompt below. Press Generate or use Google sign-in to save prompts.</div>
                </div>
            </div>

            <textarea id="promptInput" class="prompt-input" placeholder="e.g. Create a clean landing page for a fintech app, include CTA, features, and pricing section."></textarea>

            <div class="prompt-actions">
                <button id="generateBtn" class="btn btn-primary" type="button">Generate</button>
            </div>
        </div>
    </div>

    <script>
        // Star Animation
        const createStars = () => {
            const starsContainer = document.getElementById('stars');
            const numStars = 120;

            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                // Random position
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                
                // Random size
                const size = Math.random() * 3 + 0.5;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                // Random animation delay
                star.style.animationDelay = `${Math.random() * 3}s`;
                
                // Random opacity
                star.style.opacity = (Math.random() * 0.7 + 0.3).toFixed(2);
                
                starsContainer.appendChild(star);
            }
        };

        // Initialize stars on load
        createStars();

        // Basic prompt handling (UI only)
        const input = document.getElementById('promptInput');
        const genBtn = document.getElementById('generateBtn');

        genBtn.addEventListener('click', () => {
            const prompt = input.value.trim();
            if (!prompt) {
                input.focus();
                return;
            }
            // placeholder: replace with actual generation request
            console.log('Generate prompt:', prompt);
            document.body.style.cursor = 'wait';
            setTimeout(() => {
                document.body.style.cursor = 'default';

                
            }, 2000);
        });

        // allow Cmd/Ctrl+Enter to submit
        input.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                genBtn.click();
            }
        });


        genBtn.addEventListener('click', async () => {
    const prompt = input.value.trim();
    if (!prompt) {
        input.focus();
        return;
    }

    try {
        const res = await fetch("/generate_prompt", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt })
        });

        const data = await res.json();
        if (data.error) {
            document.write("Error: " + data.error);
        } else {
            console.log("Refined Prompt:", data.response);
            alert("Refined Prompt: " + data.response);

        }
    } catch (err) {
        document.write("Request failed: " + err.message);
    }
});

    </script>
</body>
</html>
